services:
    mongo:
        image: mongo:6
        container_name: bdshop-mongo
        restart: always
        ports:
            - '27017:27017'
        volumes:
            - mongo_data:/data/db

    app:
        build: .
        container_name: bdshop-app
        restart: always
        ports:
            - '5000:5000'
        environment:
            - NODE_ENV=production
            - PORT=5000
            - MONGODB_URI=mongodb://mongo:27017/bdshop
            - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
            - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
            - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
            - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
            - API_PREFIX=/api
            - LOG_LEVEL=info
            - LOG_FILE_PATH=logs/app.log
            - RATE_LIMIT_WINDOW_MS=900000
            - RATE_LIMIT_MAX_REQUESTS=100
            - CORS_ORIGIN=${CORS_ORIGIN:?CORS_ORIGIN is required}
            - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
            - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
            - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
            - CLOUDINARY_URL=${CLOUDINARY_URL:-}
        depends_on:
            - mongo

volumes:
    mongo_data:
